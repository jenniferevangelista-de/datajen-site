<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BRQ">
  <!--
    Ícone do site: quadrado branco de arredondamento mínimo, borda neutra e o
    "b" do logotipo dentro. É a MESMA arte do favicon.ico — o browser prefere
    o SVG (sizes="any"), então os dois têm de bater. Era o wordmark inteiro
    "brq®", que a 16px virava borrão.

    Geometria: o traço do SVG é centrado no caminho, então o retângulo entra
    2px para a borda de 4px cair inteira dentro do quadro, e o rx é 12
    (14 - 2) para o raio EXTERNO fechar em 14.

    O "b" é mais alto que largo e tem haste ascendente: fica centrado pela
    caixa de TINTA (34px de cada lado) e um pouco ACIMA do centro geométrico
    (21px em cima contra 25 embaixo), que é onde o olho lê o meio.
  -->
  <rect x="2" y="2" width="124" height="124" rx="12" fill="#ffffff" stroke="#cecece" stroke-width="4"/>
  <g transform="translate(9.9 6.452) scale(0.1469534)" fill="#121212">
    <path d="M381.16 345.79C380.76 345.79 380.36 345.76 379.95 345.76H377.71L381.16 345.79Z"/>
